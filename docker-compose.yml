services:
  web1:
    image: nginx:latest
    ports:
      - '8080:80'
    volumes:
      - ./src:/var/www/html
      - ./default.conf:/etc/nginx/conf.d/default.conf
    links:
      - php1
    environment:
      VIRTUAL_HOST: x.fuckrkn.club

  php1:
    # image: php:8.3-fpm
    build: .docker/php
    volumes:
      - ./src:/var/www/html
      - .:/var/www:cached

  db1:
    image: mysql:8.4
    restart: always
    ports:
      - 3306:3306
    volumes:
      - .docker/db/data:/var/lib/mysql
      - .docker/logs:/var/log/mysql
      - .docker/db/my.cnf:/etc/mysql/conf.d/my.cnf
      - .docker/db/sql:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: +GVSd(hZ#*anZyWf
      MYSQL_DATABASE: xloving
      MYSQL_USER: xloving
      MYSQL_PASSWORD: +ScJt5*sgLka*&K8

  phpmyadmin1:
    image: phpmyadmin/phpmyadmin
    ports:
      - 8181:80
    links:
      - db1
    environment:
      PMA_HOST: db1
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    volumes:
      - .docker/phpmyadmin/sessions:/sessions
      - .docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php

networks:
  default:
    external: true
    name: nginx-proxy
